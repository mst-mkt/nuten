name: Formatting style
description: Propose a change to how Nuten formats code
labels: [style]
body:
  - type: textarea
    id: current
    attributes:
      label: Current formatting
      description: Code as Nuten formats it now.
      render: nushell
    validations:
      required: true

  - type: textarea
    id: proposed
    attributes:
      label: Proposed formatting
      description: The same code as you would like Nuten to format it.
      render: nushell
    validations:
      required: true

  - type: textarea
    id: reason
    attributes:
      label: Reason
      description: Why you prefer the proposed style. References help, such as how Nushell's own code or other formatters write it.
    validations:
      required: true

  - type: textarea
    id: settings
    attributes:
      label: Settings
      description: Any settings that differ from the defaults.

  - type: input
    id: nuten-version
    attributes:
      label: Nuten version
      description: The output of `nuten --version`, or the version of the plugin or extension.
      placeholder: nuten 0.1.0
