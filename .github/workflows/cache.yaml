name: cache

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  cache:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            system: x86_64-linux
          - runner: ubuntu-24.04-arm
            system: aarch64-linux
          - runner: macos-15
            system: aarch64-darwin
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: nuten
          skipPush: true
      # Only what check would otherwise compile, not everything the build left in the store.
      - name: nix build | cachix push
        shell: bash
        run: >-
          nix build --no-link --print-out-paths --no-update-lock-file
          ".#packages.$SYSTEM.default"
          ".#packages.$SYSTEM.default.cargoArtifacts"
          "./nix/dev#packages.$SYSTEM.nushell"
          | cachix push nuten
        env:
          SYSTEM: ${{ matrix.system }}
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
