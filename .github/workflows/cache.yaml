name: cache

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  cache:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            system: x86_64-linux
          - runner: ubuntu-24.04-arm
            system: aarch64-linux
          - runner: macos-15
            system: aarch64-darwin
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - name: Free disk space
        if: ${{ runner.os == 'Linux' }}
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@v31.11.2
      - uses: cachix/cachix-action@v17
        with:
          name: nuten
          skipPush: true
      # Only what check would otherwise compile, not everything the build left in the store.
      - name: nix build | cachix push
        shell: bash
        run: >-
          nix build --no-link --print-out-paths --no-update-lock-file
          ".#packages.$SYSTEM.default"
          ".#packages.$SYSTEM.default.cargoArtifacts"
          "./nix/dev#packages.$SYSTEM.nushell"
          | cachix push nuten
        env:
          SYSTEM: ${{ matrix.system }}
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
