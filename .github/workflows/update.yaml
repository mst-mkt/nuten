name: update

on:
  schedule:
    - cron: "0 0 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  BRANCH: update/flake
  TITLE: "chore(nix): update the flake inputs"
  GIT_NAME: github-actions[bot]
  GIT_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com

jobs:
  flake:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@v31.11.2
      - name: Update root flake (./flake.lock)
        run: nix flake update
      - name: Update dev flake (./nix/dev/flake.lock)
        run: nix flake update --flake ./nix/dev
      - name: Follow flake
        run: nix shell --inputs-from ./nix/dev nixpkgs#nushell --command nu scripts/follow-flake.nu
      - name: Check for changes
        id: diff
        run: git diff --quiet || echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Commit changes
        if: ${{ steps.diff.outputs.changed }}
        run: git -c user.name="$GIT_NAME" -c user.email="$GIT_EMAIL" commit --all --message "$TITLE"
      - name: Push changes
        if: ${{ steps.diff.outputs.changed }}
        run: |
          gh auth setup-git
          git push --force origin "HEAD:refs/heads/$BRANCH"
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Create pull request
        if: ${{ steps.diff.outputs.changed }}
        run: |
          if [ "$(gh pr list --head "$BRANCH" --state open --json number --jq length)" -eq 0 ]; then
            gh pr create --head "$BRANCH" --title "$TITLE" --body ""
          fi
        env:
          GH_TOKEN: ${{ github.token }}
